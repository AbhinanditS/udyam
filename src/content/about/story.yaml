- id: the-problem
  order: 2
  status: published
  title:
    en: The problem we address
    hi: हम किस समस्या पर काम करते हैं
  body:
    en: |-
      Rural skilling programmes depend on domain skill trainers. The quality of training depends on how well those trainers are prepared, supported and recognised.

      After training, many new entrepreneurs also need continued guidance, simple tools to run their business and help to prepare for credit.
    hi: |-
      ग्रामीण कौशल विकास कार्यक्रम डोमेन कौशल प्रशिक्षकों पर निर्भर करते हैं। प्रशिक्षण की गुणवत्ता इस बात पर निर्भर करती है कि इन प्रशिक्षकों को कितनी अच्छी तैयारी, सहयोग और सम्मान मिलता है।

      प्रशिक्षण के बाद कई नए उद्यमियों को भी निरंतर मार्गदर्शन, व्यवसाय चलाने के सरल साधनों और ऋण की तैयारी में मदद की ज़रूरत होती है।
  editorialNote: Written from the website brief. Confirm that it matches how UdyamSetu describes its purpose.

- id: our-approach
  order: 3
  status: published
  title:
    en: Our approach
    hi: हमारा दृष्टिकोण
  body:
    en: |-
      We work on both sides of the training room. For trainers, we build capacity through structured development programmes, certification and a master trainer network. For trainees, we provide app-based onboarding, mentorship led by domain skill trainers, and digital tools for running an enterprise.

      Our programmes are designed to be delivered with institutional partners, including RSETIs, banks, CSR partners, government bodies and NGOs.
    hi: |-
      हम प्रशिक्षण कक्ष के दोनों ओर काम करते हैं। प्रशिक्षकों के लिए हम संरचित विकास कार्यक्रमों, प्रमाणन और मास्टर ट्रेनर नेटवर्क के माध्यम से क्षमता निर्माण करते हैं। प्रशिक्षुओं के लिए हम ऐप आधारित ऑनबोर्डिंग, डोमेन कौशल प्रशिक्षकों के नेतृत्व में मार्गदर्शन और उद्यम चलाने के लिए डिजिटल साधन उपलब्ध कराते हैं।

      हमारे कार्यक्रम संस्थागत साझेदारों के साथ मिलकर चलाने के लिए बनाए गए हैं, जिनमें आरसेटी, बैंक, सीएसआर साझेदार, सरकारी निकाय और एनजीओ शामिल हैं।
  editorialNote: Written from the website brief. Confirm before launch.

