# Vision, mission and philosophy, as supplied by UdyamSetu.
vision:
  text:
    en: To emerge as a premier institution catalyzing entrepreneurship, skill enhancement, and livelihood opportunities across rural India.
    hi: ग्रामीण भारत में उद्यमिता, कौशल संवर्धन और आजीविका के अवसरों को गति देने वाली एक अग्रणी संस्था के रूप में उभरना।
mission:
  text:
    en: To empower trainers and trainees through structured programs, technology integration, and impactful partnerships.
    hi: संरचित कार्यक्रमों, प्रौद्योगिकी के एकीकरण और प्रभावी साझेदारियों के माध्यम से प्रशिक्षकों और प्रशिक्षुओं को सशक्त बनाना।
philosophy:
  text:
    en: We believe in inclusive growth, where rural talent meets opportunity through structured mentorship, learning, and innovation.
    hi: हम समावेशी विकास में विश्वास करते हैं, जहाँ संरचित मार्गदर्शन, सीखने और नवाचार के माध्यम से ग्रामीण प्रतिभा को अवसर मिलते हैं।
